name: tests

# Every PR into develop or main, and every push that lands on them. The rulesets on
# both branches require the "tests-passed" context below, so renaming that job
# silently unprotects them.
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

# A second push to the same branch cancels the first; main is never cancelled.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the package
        run: |
          if [ -f pyproject.toml ]; then
            python -m pip install --upgrade pip
            pip install -e ".[transcribe]" || pip install -e .
          else
            echo "::notice::no pyproject.toml yet — skipping install"
          fi

      # The check is the gate. It must run with no network and no token.
      # The fallback exists only until #2 creates tests/smoke.py; #2 removes it.
      - name: Repo check
        run: |
          if [ -f tests/smoke.py ]; then
            python3 tests/smoke.py
          else
            echo "::warning::tests/smoke.py does not exist yet — nothing was verified (see issue #2)"
          fi

  # One stable context for the branch rulesets to require, whatever the matrix
  # happens to contain. Fails if any matrix leg failed or was skipped.
  tests-passed:
    if: always()
    needs: [check]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every check leg succeeded
        run: |
          echo "check result: ${{ needs.check.result }}"
          [ "${{ needs.check.result }}" = "success" ]

  # Promoting develop into main is a release, so the version must have moved.
  # Label the promote PR "no-release" for a docs-only promote.
  version-bumped:
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compare version against main
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'no-release') }}
        run: |
          if [ ! -f pyproject.toml ]; then
            echo "::notice::no pyproject.toml yet — nothing to compare"
            exit 0
          fi
          read_version() { python3 -c "import tomllib,sys; print(tomllib.load(open(sys.argv[1],'rb'))['project']['version'])" "$1"; }
          HEAD_V=$(read_version pyproject.toml)
          git show origin/main:pyproject.toml > /tmp/main-pyproject.toml 2>/dev/null || { echo "main has no pyproject.toml — first release, version $HEAD_V"; exit 0; }
          MAIN_V=$(read_version /tmp/main-pyproject.toml)
          echo "main: $MAIN_V   this PR: $HEAD_V"
          if [ "$HEAD_V" = "$MAIN_V" ]; then
            echo "::error::version is still $MAIN_V. Run scripts/bump_version.py on develop, or label this PR 'no-release'."
            exit 1
          fi
